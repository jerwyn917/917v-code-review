<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Review Explore</title>
<!--
  917 Ventures Explore view: a floor plan of the review. Wings are directories (or categories / severities),
  rooms are files, and every tile is one finding from this review's findings.json. Nothing else is drawn.
  Motion: GSAP 3.13.0 (cdnjs) moves the camera, the rooms and the tiles; Motion 12.23.24 (the vanilla build of
  Framer Motion, jsDelivr) animates the detail panel. Offline, or with reduced motion, the page works without them.
  The review data is inlined below and never leaves the page.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg:#FAFBFF; --card:#FFFFFF; --fg:#040815; --fg-2:#323643; --muted:#606471; --border:#D0D5DD;
  --accent:#407DC3; --accent-text:#3A6DBA; --accent-soft:#EEF4FF; --navy:#142741; --focus:#50A6D8;
  --warning:#B45309; --warning-bg:#FFF4E0; --code-bg:#F3F4F6;
  --font-display:"Unbounded","Arial Black",Arial,sans-serif; --font-body:"Montserrat","Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:15px; --radius-sm:8px; --shadow:0 1px 2px rgba(0,0,0,.06); --lift:0 10px 28px rgba(4,8,21,.18);
  --plan:#F1F5FC; --grid:rgba(64,125,195,.13); --room:#E6EEFB; --wall:rgba(20,39,65,.72); --wing:rgba(255,255,255,.55);
  --sev-critical:#D92D20; --sev-high:#DB6E4F; --sev-medium:#B45309; --sev-low:#407DC3; --sev-info:#8EA1BD; --sev-on:#FFFFFF;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0B1220; --card:#142741; --fg:#F5F7FB; --fg-2:#DDE3EE; --muted:#A4A6BA; --border:#2A3B57;
  --accent:#65DDF5; --accent-text:#8CC8F5; --accent-soft:#1B2E4D; --warning:#F5B553; --warning-bg:#3D2A0A; --code-bg:#0F1B33;
  --lift:0 10px 28px rgba(0,0,0,.5); --plan:#0A111E; --grid:rgba(101,221,245,.08); --room:#0F1D34; --wall:rgba(140,200,245,.5); --wing:rgba(20,39,65,.35);
  --sev-critical:#F2555A; --sev-high:#F0997B; --sev-medium:#F5C451; --sev-low:#65DDF5; --sev-info:#A4A6BA; --sev-on:#040815; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0B1220; --card:#142741; --fg:#F5F7FB; --fg-2:#DDE3EE; --muted:#A4A6BA; --border:#2A3B57;
  --accent:#65DDF5; --accent-text:#8CC8F5; --accent-soft:#1B2E4D; --warning:#F5B553; --warning-bg:#3D2A0A; --code-bg:#0F1B33;
  --lift:0 10px 28px rgba(0,0,0,.5); --plan:#0A111E; --grid:rgba(101,221,245,.08); --room:#0F1D34; --wall:rgba(140,200,245,.5); --wing:rgba(20,39,65,.35);
  --sev-critical:#F2555A; --sev-high:#F0997B; --sev-medium:#F5C451; --sev-low:#65DDF5; --sev-info:#A4A6BA; --sev-on:#040815; color-scheme:dark }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 var(--font-body); display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
[hidden] { display:none !important; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible { outline:2.5px solid var(--focus); outline-offset:2px; }
.mono { font-family:var(--font-mono); font-size:12px; overflow-wrap:anywhere; }
.muted { color:var(--muted); }
.grow { flex:1 1 0; min-width:0; }

header.bar { flex:none; background:var(--card); box-shadow:0 4px 6px -1px rgba(0,0,0,.1); position:relative; z-index:6; }
header.bar .in { padding:10px max(16px, env(safe-area-inset-left, 0px)); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
header.bar .logo { width:150px; height:auto; background:#fff; border-radius:8px; padding:4px 8px; display:block; }
header.bar h1 { font-family:var(--font-display); font-size:17px; font-weight:600; margin:0; overflow-wrap:anywhere; }
header.bar .meta { color:var(--muted); font-size:12px; }
header.bar .grow { flex:1 1 240px; }
.nav { display:flex; border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; background:var(--bg); }
.nav a, .nav span { font-size:13px; font-weight:600; padding:5px 14px; border-radius:999px; text-decoration:none; color:var(--fg-2); }
.nav a:hover { color:var(--accent-text); background:var(--accent-soft); }
.nav .cur { background:var(--navy); color:#fff; }
:root[data-theme="dark"] .nav .cur { background:var(--accent); color:#040815; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nav .cur { background:var(--accent); color:#040815; } }

.btn, select, input[type=search] { font:inherit; font-size:13px; padding:7px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--card); color:var(--fg); }
.btn { cursor:pointer; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:border-color .15s, background-color .15s, transform .12s; }
.btn:hover { border-color:var(--accent); }
.btn:active { transform:scale(.96); }
.btn[disabled] { opacity:.4; cursor:default; }
.btn.ic { padding:7px 10px; min-width:34px; justify-content:center; }
select { max-width:220px; }

.tools { flex:none; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px max(16px, env(safe-area-inset-left, 0px)); border-bottom:1px solid var(--border); background:var(--bg); position:relative; z-index:5; }
.tools input[type=search] { flex:1 1 220px; min-width:0; max-width:340px; }
.seg { display:flex; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; background:var(--card); }
.seg button { font:inherit; font-size:13px; font-weight:600; padding:7px 12px; border:0; background:none; color:var(--fg-2); cursor:pointer; transition:background-color .2s, color .2s; }
.seg button + button { border-left:1px solid var(--border); }
.seg button[aria-pressed="true"] { background:var(--accent-soft); color:var(--accent-text); }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { font:inherit; font-size:12px; font-weight:600; padding:5px 10px; border:1px solid var(--border); border-radius:999px; background:var(--card); color:var(--fg-2); cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:border-color .15s, background-color .2s, opacity .2s; }
.chip i { width:9px; height:9px; border-radius:3px; background:var(--sevc); display:inline-block; }
.chip[aria-pressed="true"] { border-color:var(--sevc); background:color-mix(in srgb, var(--sevc) 14%, var(--card)); color:var(--fg); }
.chips.some .chip[aria-pressed="false"] { opacity:.55; }
.count { font-size:12px; color:var(--muted); margin-left:auto; white-space:nowrap; }

.stage { flex:1 1 0; min-height:0; position:relative; overflow:hidden; }
.vp { position:absolute; inset:0; overflow:hidden; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
  background-color:var(--plan);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:var(--gs, 40px) var(--gs, 40px); background-position:var(--gx, 0px) var(--gy, 0px); }
.vp.grabbing { cursor:grabbing; }
.world { position:absolute; left:0; top:0; transform-origin:0 0; --inv:1; }
.box { position:absolute; left:0; top:0; }
.wing { z-index:0; border:1.5px dashed var(--border); border-radius:20px; background:var(--wing); }
.room { z-index:1; border:2px solid var(--wall); border-radius:12px; background:var(--room); }
.room.lit { border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.bh { position:absolute; left:0; right:0; top:0; display:flex; align-items:center; gap:8px; padding:0 12px; border:0; background:none; color:inherit; font:inherit; cursor:pointer; text-align:left; white-space:nowrap; }
.wing > .bh { height:44px; color:var(--muted); font-size:calc(11.5px * var(--inv)); font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
.room > .bh { height:36px; font-size:calc(12.5px * var(--inv)); font-weight:700; color:var(--fg); }
.bh .nm { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.bh:hover .nm { color:var(--accent-text); }
.bh .ct { flex:none; font-size:.85em; font-weight:700; border-radius:999px; padding:0 .6em; background:var(--sevc, var(--border)); color:var(--sev-on); font-variant-numeric:tabular-nums; }
.wing > .bh .ct { background:none; color:var(--muted); padding:0; }

.tile { position:absolute; left:0; top:0; width:176px; height:66px; padding:0; border:0; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer; z-index:2; }
.tile.off { visibility:hidden; pointer-events:none; }
.tin { position:absolute; inset:0; display:block; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:7px 10px 7px 16px; overflow:hidden; box-shadow:var(--shadow);
  transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s, opacity .3s, filter .3s, border-color .2s, background-color .3s; }
.tin::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--sevc); }
.tile.pot .tin::before { background:repeating-linear-gradient(135deg, var(--sevc) 0 4px, transparent 4px 7px); }
.t1 { display:flex; align-items:baseline; gap:6px; font-family:var(--font-mono); font-size:11px; color:var(--muted); white-space:nowrap; }
.t1 b { color:var(--fg); font-size:12px; }
.tt { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:11.5px; line-height:1.3; font-weight:600; margin-top:2px; color:var(--fg-2); }
.tile:hover { z-index:3; }
.tile:hover .tin, .tile:focus-visible .tin { transform:translateY(-2px) scale(1.035); box-shadow:var(--lift); border-color:var(--sevc); }
.tile.sel { z-index:4; }
.tile.sel .tin { transform:scale(1.08); border-color:var(--sevc); box-shadow:0 0 0 3px color-mix(in srgb, var(--sevc) 38%, transparent), var(--lift); }
.tile.sel::after { content:""; position:absolute; inset:-4px; border-radius:14px; border:2px solid var(--sevc); opacity:0; pointer-events:none; animation:ping .8s ease-out 1; }
@keyframes ping { from { opacity:.8; transform:scale(1); } to { opacity:0; transform:scale(1.35); } }
.world.has-sel .tile:not(.sel) .tin { opacity:.55; }
.world.has-sel .tile.kin:not(.sel) .tin { opacity:.9; }
.tile.dim .tin, .world.has-sel .tile.dim:not(.sel) .tin { opacity:.14; filter:saturate(.2); }
.vp.far .tin { background:var(--sevc); border-color:transparent; }
.vp.far .t1, .vp.far .tt { opacity:0; }
.vp.far .tile.pot .tin { background:repeating-linear-gradient(135deg, var(--sevc) 0 9px, color-mix(in srgb, var(--sevc) 45%, var(--card)) 9px 16px); }
.no-gsap .tile { transition:transform .55s cubic-bezier(.6,0,.2,1); }
.no-gsap .world { transition:transform .5s cubic-bezier(.6,0,.2,1); }
.no-gsap .vp.grabbing .world { transition:none; }

.empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:24px; color:var(--muted); pointer-events:none; }
.empty .btn, .empty a { pointer-events:auto; }
.empty strong { font-family:var(--font-display); font-size:16px; color:var(--fg); font-weight:600; }

.zoom { position:absolute; left:12px; top:12px; display:flex; flex-direction:column; gap:4px; z-index:3; }
.zoom .btn { box-shadow:var(--lift); }
.mm { position:absolute; left:12px; bottom:12px; z-index:3; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:6px; box-shadow:var(--shadow); cursor:pointer; touch-action:none; transition:opacity .35s; }
.mm.idle { opacity:0; pointer-events:none; }
.mm .in { position:relative; overflow:hidden; border-radius:4px; background:var(--plan); }
.mm .in > i { position:absolute; border-radius:1.5px; background:var(--sevc); opacity:.6; }
.mm .view { position:absolute; border:1.5px solid var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); border-radius:2px; pointer-events:none; }
.mm .dot { position:absolute; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:var(--fg); box-shadow:0 0 0 2px var(--card); pointer-events:none; }
.hint { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:2; font-size:12px; color:var(--muted); background:var(--card); border:1px solid var(--border); border-radius:999px; padding:4px 14px; box-shadow:var(--shadow); pointer-events:none; white-space:nowrap; transition:opacity .5s; max-width:calc(100% - 24px); overflow:hidden; text-overflow:ellipsis; }
.hint.gone { opacity:0; }

.panel { position:absolute; top:12px; right:12px; bottom:12px; width:min(440px, calc(100% - 24px)); z-index:4; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--lift); overflow:hidden; }
.ph { flex:none; display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); }
.ph .pos { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:64px; text-align:center; }
.pb { flex:1 1 0; min-height:0; overflow:auto; padding:16px 18px 22px; overscroll-behavior:contain; }
.pb h2 { font-size:18px; line-height:1.3; margin:0; overflow-wrap:anywhere; }
.pb .sec { margin-top:22px; }
.pb .ttl { font-size:11.5px; font-weight:700; margin:14px 0 4px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.sec h3 { font-size:11.5px; font-weight:700; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.sec p { margin:0; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--fg-2); }
.sec p.none, .sec p.gn { color:var(--muted); font-size:12.5px; white-space:normal; }
.sec p.gn { margin-top:8px; }
.sec pre { margin:0; background:var(--code-bg); padding:12px 14px; border-radius:var(--radius-sm); overflow-x:auto; font:12.5px/1.55 var(--font-mono); border-left:3px solid var(--sevc, var(--border)); }
.ev > * + * { margin-top:10px; }
.refs { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.ref { display:inline-flex; align-items:center; font-size:12.5px; font-weight:600; padding:3px 12px; border-radius:999px; border:1px solid var(--border); color:var(--fg-2); text-decoration:none; }
a.ref { color:var(--accent-text); background:var(--accent-soft); border-color:transparent; }
a.ref:hover { border-color:var(--accent); }
a.ref::after { content:"↗"; margin-left:6px; font-size:11px; }
.gcs { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:10px; }
.gc { display:grid; gap:2px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; min-width:0; }
.gc .gl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
.gc b { font-size:14px; overflow-wrap:anywhere; }
.gc .mono { font-family:var(--font-mono); font-size:12px; color:var(--fg-2); }
.gc .mono a, .loc a, header.bar .meta a { color:var(--accent-text); font-weight:600; text-decoration:none; }
.gc .mono a:hover, .loc a:hover, header.bar .meta a:hover { text-decoration:underline; }
.gc .gs { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
.pid { font-family:var(--font-mono); font-size:12px; color:var(--muted); margin-top:12px; }
.tags { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.sev { display:inline-block; padding:1px 10px; border-radius:999px; font-size:12px; font-weight:700; color:var(--sev-on); background:var(--sevc); white-space:nowrap; }
.tag { font-size:12px; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:0 9px; white-space:nowrap; }
.tag.pot { color:var(--warning); border-color:var(--warning); background:var(--warning-bg); }
.locbox { background:var(--accent-soft); border-radius:var(--radius-sm); padding:10px 12px; }
.locbox .mono { font-size:12.5px; color:var(--fg); font-weight:600; }
.acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.acts .btn { font-size:12px; padding:4px 10px; }
.rel { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px; }
.rel li { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.rel a { font-size:12px; color:var(--accent-text); font-weight:600; }
.sib { display:flex; flex-wrap:wrap; gap:6px; }
.sib .chip { font-family:var(--font-mono); }
a.dash { font-size:12px; font-weight:600; color:var(--accent-text); }
.no-motion .panel:not([hidden]) { animation:pin .28s cubic-bezier(.2,.8,.2,1); }
@keyframes pin { from { opacity:0; transform:translateX(32px); } to { opacity:1; transform:none; } }

@media (max-width:760px) {
  header.bar .in { gap:6px 10px; padding-top:8px; padding-bottom:8px; }
  header.bar .logo { width:96px; } header.bar h1 { font-size:14px; }
  header.bar .grow { flex:1 1 100%; order:5; } header.bar .meta { display:none; }
  header.bar .nav { margin-left:auto; } .nav a, .nav span { font-size:12px; padding:4px 10px; }
  #theme { font-size:12px; padding:5px 9px; }
  .tools { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-top:8px; padding-bottom:8px; }
  .tools > * { flex:none; } .tools input[type=search] { flex:0 0 190px; } .chips { flex-wrap:nowrap; }
  .panel { top:auto; left:8px; right:8px; bottom:8px; width:auto; height:62%; }
  .mm, .hint { display:none; }
  .count { margin-left:0; }
  @keyframes pin { from { opacity:0; transform:translateY(32px); } to { opacity:1; transform:none; } }
}
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header class="bar"><div class="in">
  <img class="logo" alt="917Ventures" width="150" height="29" src="{{logo_data_uri}}">
  <div class="grow"><h1 id="title">Explore</h1><div class="meta" id="meta"></div></div>
  <nav class="nav" aria-label="Review views"><a href="dashboard.html" id="to-dash">Dashboard</a><span class="cur" aria-current="page">Explore</span></nav>
  <button class="btn" id="theme" type="button" aria-label="Switch light or dark theme">Theme</button>
</div></header>
<div class="tools" id="tools">
  <input type="search" id="q" placeholder="Search ID, title, file, description…  ( / )" aria-label="Search findings">
  <div class="seg" role="group" aria-label="Arrange the plan by" id="group">
    <button type="button" data-g="file" aria-pressed="true">Files</button>
    <button type="button" data-g="category" aria-pressed="false">Categories</button>
    <button type="button" data-g="severity" aria-pressed="false">Severity</button>
  </div>
  <div class="chips" role="group" aria-label="Filter by severity" id="f-sev"></div>
  <select id="f-cat" aria-label="Filter by category"><option value="">All categories</option></select>
  <select id="f-file" aria-label="Filter by file"><option value="">All files</option></select>
  <select id="f-status" aria-label="Filter by status"><option value="">Any status</option></select>
  <button class="btn" type="button" id="clear">Clear</button>
  <span class="count" id="count" aria-live="polite"></span>
</div>
<main class="stage" id="stage">
  <div class="vp" id="vp" aria-label="Floor plan of the review findings">
    <div class="world" id="world"><div id="rooms"></div><div id="tiles"></div></div>
  </div>
  <div class="empty" id="empty" hidden><strong id="empty-t"></strong><span id="empty-d"></span><button class="btn" type="button" id="empty-clear">Clear filters</button></div>
  <div class="zoom" id="zoom">
    <button class="btn ic" type="button" id="z-in" aria-label="Zoom in">+</button>
    <button class="btn ic" type="button" id="z-out" aria-label="Zoom out">−</button>
    <button class="btn ic" type="button" id="z-fit" aria-label="Fit the whole plan" title="Fit the whole plan (0)">⤢</button>
  </div>
  <div class="mm" id="mm" aria-hidden="true"><div class="in" id="mm-in"><div class="view" id="mm-view"></div><div class="dot" id="mm-dot" hidden></div></div></div>
  <div class="hint" id="hint">Drag to pan · scroll to zoom · click a finding · hatched = potential</div>
  <aside class="panel" id="panel" aria-labelledby="p-title" hidden>
    <div class="ph">
      <button class="btn ic" type="button" id="p-prev" aria-label="Previous finding" title="Previous (←)">←</button>
      <span class="pos" id="p-pos"></span>
      <button class="btn ic" type="button" id="p-next" aria-label="Next finding" title="Next (→)">→</button>
      <span class="grow"></span>
      <button class="btn" type="button" id="p-close" title="Back to the overview (Esc)">Overview ✕</button>
    </div>
    <div class="pb" id="p-body"></div>
  </aside>
</main>
<script id="review-data" type="application/json">{{data_json}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.24/dist/motion.js"></script>
<script>
(function () {
  "use strict";

  function ensureVisible(id) {
    const t = T[id]; if (!t || !t.shown) return;
    const r = freeRect(), sx = cam.x + t.x * cam.k, sy = cam.y + t.y * cam.k;
    if (sx < r.x + 8 || sy < r.y + 8 || sx + TW * cam.k > r.x + r.w - 8 || sy + TH * cam.k > r.y + r.h - 8) {
      const k = Math.max(cam.k, 0.6);
      flyTo({ k: k, x: r.x + r.w / 2 - (t.x + TW / 2) * k, y: r.y + r.h / 2 - (t.y + TH / 2) * k }, 0.5);
    }
  }
  const centre = () => ({ x: vp.clientWidth / 2, y: vp.clientHeight / 2 });
  $("z-in").onclick = () => { const c = centre(); zoomAt(c.x, c.y, 1.4, 0.35); };
  $("z-out").onclick = () => { const c = centre(); zoomAt(c.x, c.y, 1 / 1.4, 0.35); };
  $("z-fit").onclick = () => { if (LAYOUT.order.length) flyTo(fitAll(), 0.7); };

  /* ---------- pan, zoom, click ---------- */
  const P = new Map(); let drag = null, pinch = 0, justDragged = false;
  const hintOff = () => $("hint").classList.add("gone");
  vp.addEventListener("pointerdown", e => {
    if (e.button) return;
    P.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (HAS_GSAP) gsap.killTweensOf(cam);
    if (P.size === 1) { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; moved = false; }
    else if (P.size === 2) { const a = Array.from(P.values()); pinch = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); moved = true; }
  });
  vp.addEventListener("pointermove", e => {
    if (!P.has(e.pointerId)) return;
    P.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (P.size === 2 && pinch) {
      const a = Array.from(P.values()), d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), box = vp.getBoundingClientRect();
      zoomAt((a[0].x + a[1].x) / 2 - box.left, (a[0].y + a[1].y) / 2 - box.top, d / pinch); pinch = d;
      return;
    }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) < 5) return;
    if (!moved) { moved = true; vp.classList.add("grabbing"); hintOff(); try { vp.setPointerCapture(e.pointerId); } catch (err) {} }
    cam.x = drag.cx + dx; cam.y = drag.cy + dy; applyCam();
  });
  function pointerEnd(e) {
    if (!P.has(e.pointerId)) return;
    P.delete(e.pointerId);
    if (P.size < 2) pinch = 0;
    if (P.size === 1) { const a = Array.from(P.values())[0]; drag = { x: a.x, y: a.y, cx: cam.x, cy: cam.y }; }
    if (P.size === 0) {
      drag = null; vp.classList.remove("grabbing");
      if (moved) { justDragged = true; setTimeout(() => { justDragged = false; }, 0); }
    }
  }
  vp.addEventListener("pointerup", pointerEnd); vp.addEventListener("pointercancel", pointerEnd);
  vp.addEventListener("wheel", e => {
    e.preventDefault(); hintOff();
    const box = vp.getBoundingClientRect(), d = e.deltaY * (e.deltaMode === 1 ? 16 : 1);
    zoomAt(e.clientX - box.left, e.clientY - box.top, Math.exp(-d * (e.ctrlKey ? 0.012 : 0.0018)));
  }, { passive: false });
  vp.addEventListener("scroll", () => { vp.scrollTop = 0; vp.scrollLeft = 0; });
  vp.addEventListener("click", e => {
    if (justDragged) return;
    const tile = e.target.closest(".tile");
    if (tile) { hintOff(); select(tile.dataset.id); return; }
    const head = e.target.closest(".bh");
    if (head) { const b = head.parentNode._box; if (b) flyTo(fitBox(b, 1.25, 48), 0.7); return; }
    if (SEL) closeSel();
  });
  vp.addEventListener("dblclick", e => {
    if (e.target.closest(".tile, .bh")) return;
    const box = vp.getBoundingClientRect(); zoomAt(e.clientX - box.left, e.clientY - box.top, 1.6, 0.35);
  });
  function mmJump(e) {
    const box = mmIn.getBoundingClientRect();
    const wx = (e.clientX - box.left) / mmk, wy = (e.clientY - box.top) / mmk, r = freeRect();
    flyTo({ k: cam.k, x: r.x + r.w / 2 - wx * cam.k, y: r.y + r.h / 2 - wy * cam.k }, 0);
  }
  mm.addEventListener("pointerdown", e => { mm.setPointerCapture(e.pointerId); mm._on = true; mmJump(e); });
  mm.addEventListener("pointermove", e => { if (mm._on) mmJump(e); });
  mm.addEventListener("pointerup", () => { mm._on = false; });
  window.addEventListener("resize", applyCam);

  /* ---------- search: dim the rest, keep everything in place ---------- */
  function hay(f) { return [f.id, f.title, f.file, f.description, f.category, f.cwe, f.owasp, gitHay(f)].filter(Boolean).join(" ").toLowerCase(); }
  function navList() { return MATCH ? ORDER.filter(id => MATCH.has(id)) : ORDER; }
  function search(move) {
    const q = STATE.q.toLowerCase();
    MATCH = q ? new Set(ORDER.filter(id => hay(T[id].f).indexOf(q) >= 0)) : null;
    ORDER.forEach(id => T[id].el.classList.toggle("dim", !!MATCH && !MATCH.has(id)));
    counts();
    if (SEL) updatePos();
    if (move && MATCH && MATCH.size && !SEL) {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      MATCH.forEach(id => { const t = T[id]; x0 = Math.min(x0, t.x); y0 = Math.min(y0, t.y); x1 = Math.max(x1, t.x + TW); y1 = Math.max(y1, t.y + TH); });
      flyTo(fitBox({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 }, 1.15, 90), 0.7);
    }
  }
  function counts() {
    const n = ORDER.length, all = findings.length;
    let text = n === all ? all + (all === 1 ? " finding" : " findings") : "Showing " + n + " of " + all + " findings";
    if (MATCH) text += " · " + MATCH.size + (MATCH.size === 1 ? " match" : " matches");
    $("count").textContent = text;
    const none = !n || (MATCH && !MATCH.size);
    $("empty").hidden = !!all && !none;
    if (!all) {
      $("empty-clear").hidden = true;
      $("empty-t").textContent = "No findings to explore";
      $("empty-d").textContent = "This review recorded no findings, so the plan is empty.";
    } else if (none) {
      $("empty-clear").hidden = false;
      $("empty-t").textContent = n ? "No finding matches “" + STATE.q + "”" : "No findings match these filters";
      $("empty-d").textContent = n ? "The plan still shows the " + n + " filtered findings, dimmed." : "Remove a filter to bring findings back onto the plan.";
    }
  }

  /* ---------- refresh: filters or arrangement changed ---------- */
  function refresh(intro) {
    syncControls();
    LAYOUT = layout(findings.filter(pass));
    ORDER = LAYOUT.order;
    drawBoxes(LAYOUT, intro); drawTiles(LAYOUT, intro); drawMinimap(LAYOUT);
    savedCam = null;
    search(false);
    if (SEL && !LAYOUT.pos[SEL]) closeSel(true);
    markRoom();
    if (!ORDER.length) { applyCam(); return; }
    if (intro) {
      const c = fitAll();
      if (ANIM) { const s = 0.86; cam.k = c.k * s; cam.x = c.x + LAYOUT.w * c.k * (1 - s) / 2; cam.y = c.y + LAYOUT.h * c.k * (1 - s) / 2; applyCam(); flyTo(c, 1.1); }
      else flyTo(c, 0);
    } else if (SEL) { updatePos(); focusOn(SEL, 0.75); }
    else flyTo(fitAll(), 0.75);
  }

  /* ---------- selection and the detail panel ---------- */
  function markRoom() {
    BOX.forEach(node => node.classList.remove("lit"));
    ORDER.forEach(id => T[id].el.classList.remove("kin"));
    const t = SEL && T[SEL]; if (!t) return;
    const node = BOX.get(t.room); if (node) node.classList.add("lit");
    ORDER.forEach(id => { if (T[id].room === t.room) T[id].el.classList.add("kin"); });
  }
  function updatePos() {
    const l = navList(), i = l.indexOf(SEL);
    $("p-pos").textContent = i < 0 ? "— of " + l.length : (i + 1) + " of " + l.length;
    $("p-prev").disabled = $("p-next").disabled = l.length < 2 && i >= 0;
  }
  function step(d) {
    const l = navList(); if (!l.length) return;
    const i = l.indexOf(SEL);
    select(l[i < 0 ? 0 : (i + d + l.length) % l.length]);
  }
  $("p-prev").onclick = () => step(-1); $("p-next").onclick = () => step(1); $("p-close").onclick = () => closeSel();
  function select(id) {
    const t = T[id]; if (!t || !t.shown) return;
    const first = !SEL;
    if (first) savedCam = { x: cam.x, y: cam.y, k: cam.k };    // where "Overview" returns to
    if (SEL && T[SEL]) T[SEL].el.classList.remove("sel");
    SEL = id;
    t.el.classList.add("sel"); world.classList.add("has-sel");
    markRoom(); buildPanel(t.f); updatePos();
    panel.hidden = false; pbody.scrollTop = 0;
    if (MO && !RM) {
      const sheet = vp.clientWidth <= 760;
      if (first) MO.animate(panel, sheet ? { y: [48, 0], opacity: [0, 1] } : { x: [48, 0], opacity: [0, 1] }, { type: "spring", stiffness: 320, damping: 32 });
      MO.animate(pbody.querySelectorAll(".rv"), { opacity: [0, 1], y: [12, 0] }, { delay: MO.stagger(0.04, { startDelay: first ? 0.12 : 0 }), duration: 0.38, ease: [0.22, 1, 0.36, 1] });
    }
    focusOn(id);
    try { history.replaceState(null, "", "#" + encodeURIComponent(id)); } catch (e) {}
  }
  function closeSel(stay) {
    if (!SEL) return;
    const t = T[SEL];
    if (t) t.el.classList.remove("sel");
    SEL = null; world.classList.remove("has-sel"); markRoom();
    if (MO && !RM) {
      MO.animate(panel, vp.clientWidth <= 760 ? { y: 48, opacity: 0 } : { x: 48, opacity: 0 }, { duration: 0.2, ease: "easeIn" });
      setTimeout(() => { if (!SEL) panel.hidden = true; }, 210);
    } else panel.hidden = true;
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    if (!stay && LAYOUT.order.length) flyTo(savedCam || fitAll(), 0.75);
    savedCam = null;
    if (t && document.activeElement && panel.contains(document.activeElement)) t.el.focus({ preventScroll: true });
  }

  /* ---------- one finding, always the same sections in the same order ---------- */
  var LBL = { title: "Title", description: "Description", evidence: "Evidence", impact: "Potential Impact",
    recommendation: "Recommended Solution", reference: "Reference", git: "Git History" };
  Object.keys(data.sections || {}).forEach(function (k) { LBL[k] = data.sections[k]; });
  function refLinks(f) {
    var out = [], R = data.reference_urls || {}, m, o;
    if (f.cwe) {
      m = /^CWE-(\d+)$/i.exec(String(f.cwe).trim());
      out.push({ label: String(f.cwe).toUpperCase(), url: m && R.cwe ? R.cwe.replace("{id}", m[1]) : null });
    }
    if (f.owasp) {
      m = /^(A\d{2}):2021/i.exec(String(f.owasp).trim());
      o = m && R.owasp ? R.owasp[m[1].toUpperCase()] : null;
      out.push({ label: "OWASP " + f.owasp + (o ? " " + o.name : ""), url: o ? o.url : null });
    }
    (f.references || []).forEach(function (r) { r = String(r); out.push({ label: r, url: /^https?:\/\//.test(r) ? r : null }); });
    return out;
  }
  function sec(key, node) {
    var s = el("section", { "class": "sec rv" });
    s.appendChild(el("h3", null, LBL[key] || key));
    s.appendChild(node);
    return s;
  }
  function none(text) { return el("p", { "class": "none" }, text); }
  function gitNode(f) {
    var g = f.git;
    if (!g) return null;
    var box = el("div", { "class": "git" });
    if (g.status !== "traced") { box.appendChild(none("Not traced: " + (g.reason || "no Git history for these lines") + ".")); return box; }
    function card(label, c) {
      var d = el("div", { "class": "gc" });
      d.appendChild(el("span", { "class": "gl" }, label));
      d.appendChild(el("b", null, c.author || c.committer || "Unknown author"));
      var hash = el("span", { "class": "mono", title: c.commit || "" }), gh = ghCommit(c.commit);
      if (gh) hash.appendChild(el("a", { href: gh, target: "_blank", rel: "noopener", title: "Open this commit on GitHub" }, c.short || c.commit));
      else hash.appendChild(document.createTextNode(c.short || "unknown commit"));
      hash.appendChild(document.createTextNode(" · " + (c.date || "date unknown")));
      d.appendChild(hash);
      if (c.summary) d.appendChild(el("span", { "class": "gs" }, c.summary));
      if (c.committer && c.author && c.committer !== c.author) d.appendChild(el("span", { "class": "gs" }, "Committed by " + c.committer));
      return d;
    }
    var where = f.file + ":" + (g.lines || f.line), row = el("div", { "class": "gcs" });
    box.appendChild(row);
    if (g.same) {
      row.appendChild(card("Introduced by", g.introduced));
      box.appendChild(el("p", { "class": "gn" }, "No later commit has changed " + where + "."));
    } else {
      row.appendChild(card("Original introducer", g.introduced));
      row.appendChild(card("Latest contributor", g.last_changed));
      box.appendChild(el("p", { "class": "gn" }, where + " has been changed by " + (g.changes || "several") + " commits; the weakness may date from either of these two."));
    }
    if (g.note) box.appendChild(el("p", { "class": "gn" }, "Note: " + g.note + "."));
    return box;
  }
  // Description, Evidence, Potential Impact, Recommended Solution, Reference, then Git History when traced.
  // `locationNode` is the page's own way to show (and open) the cited file and line.
  function findingSections(f, locationNode) {
    var out = [], ev = el("div", { "class": "ev" }), refs = refLinks(f), rb = el("div", { "class": "refs" }), g = gitNode(f);
    out.push(sec("description", f.description ? el("p", null, f.description) : none("No description was recorded for this finding.")));
    if (locationNode) ev.appendChild(locationNode);
    if (f.evidence) ev.appendChild(el("pre", null, f.evidence)); else ev.appendChild(none("No code snippet was recorded for this finding."));
    if (f.evidence_type === "absence") ev.appendChild(el("p", { "class": "gn" }, "This finding is about something that is missing; the text above says what was looked for."));
    out.push(sec("evidence", ev));
    out.push(sec("impact", f.impact ? el("p", null, f.impact) : none("No impact was recorded for this finding.")));
    out.push(sec("recommendation", f.recommendation ? el("p", null, f.recommendation) : none("No recommendation was recorded for this finding.")));
    refs.forEach(function (r) {
      rb.appendChild(r.url ? el("a", { "class": "ref", href: r.url, target: "_blank", rel: "noopener noreferrer" }, r.label) : el("span", { "class": "ref" }, r.label));
    });
    if (!refs.length) rb.appendChild(none("No CWE or OWASP reference applies to this finding."));
    out.push(sec("reference", rb));
    if (g) out.push(sec("git", g));
    return out;
  }
  function gitHay(f) {
    var g = f.git || {}, a = g.introduced || {}, b = g.last_changed || {};
    return [a.author, a.committer, a.commit, b.author, b.committer, b.commit].filter(Boolean).join(" ");
  }
  function sect(title, node) { const s = el("section", { "class": "sec rv" }); s.appendChild(el("h3", null, title)); s.appendChild(node); return s; }
  function locActions(file, line, end) {
    const box = el("div", { "class": "acts" });
    [["vscode", "Open in VS Code"], ["cursor", "Open in Cursor"]].forEach(e => {
      const h = editorHref(e[0], file, line); if (h) box.appendChild(el("a", { "class": "btn", href: h }, e[1]));
    });
    const gh = ghFile(file, line, end);
    if (gh) box.appendChild(el("a", { "class": "btn", href: gh, target: "_blank", rel: "noopener" }, "View on GitHub"));
    const fh = fileHref(file, line, end);
    if (fh) box.appendChild(el("a", { "class": "btn", href: fh, target: "_blank", rel: "noopener" }, VIA_VIEWER && line ? "View file at line " + line : "View file"));
    const cp = el("button", { type: "button", "class": "btn" }, "Copy location");
    cp.onclick = () => {
      const text = locText(file, line), done = () => { cp.textContent = "Copied"; pop(cp); setTimeout(() => { cp.textContent = "Copy location"; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => {});
    };
    box.appendChild(cp);
    return box;
  }
  function buildPanel(f) {
    pbody.textContent = "";
    pbody.style.setProperty("--sevc", sevVar(f.severity));
    const head = el("div", { "class": "rv" }), tags = el("div", { "class": "tags" });
    if (f.severity) tags.appendChild(el("span", { "class": "sev" }, f.severity));
    if (f.status) tags.appendChild(el("span", { "class": "tag" + (f.status === "Potential" ? " pot" : "") }, f.status));
    if (f.confidence) tags.appendChild(el("span", { "class": "tag" }, f.confidence + " confidence"));
    if (f.category) tags.appendChild(el("span", { "class": "tag" }, f.category));
    if (f.in_changed_lines) tags.appendChild(el("span", { "class": "tag" }, "On changed lines"));
    else if (f.in_changed_file) tags.appendChild(el("span", { "class": "tag" }, "In a changed file"));
    head.appendChild(tags);
    head.appendChild(el("div", { "class": "pid" }, f.id));
    head.appendChild(el("div", { "class": "ttl" }, LBL.title));
    head.appendChild(el("h2", { id: "p-title" }, f.title || "Untitled finding"));
    pbody.appendChild(head);

    const loc = el("div", { "class": "locbox" });
    if (f.file) {
      loc.appendChild(el("div", { "class": "mono" }, locText(f.file, f.line, f.end_line)));
      if (!f.line) loc.appendChild(el("div", { "class": "muted" }, "No line number was recorded for this finding."));
      loc.appendChild(locActions(f.file, f.line, f.end_line));
    } else loc.appendChild(el("div", { "class": "muted" }, "No file location was recorded for this finding."));
    const rel = (f.related_locations || []).filter(l => l && l.file);
    if (rel.length) {
      const ul = el("ul", { "class": "rel" });
      rel.forEach(l => {
        const li = el("li"); li.appendChild(el("span", { "class": "mono" }, "Also at " + locText(l.file, l.line)));
        const vs = editorHref("vscode", l.file, l.line), fh = fileHref(l.file, l.line), gl = ghFile(l.file, l.line);
        if (gl) li.appendChild(el("a", { href: gl, target: "_blank", rel: "noopener" }, "GitHub"));
        if (vs) li.appendChild(el("a", { href: vs }, "VS Code"));
        if (fh) li.appendChild(el("a", { href: fh, target: "_blank", rel: "noopener" }, "View file"));
        ul.appendChild(li);
      });
      loc.appendChild(ul);
    }
    findingSections(f, loc).forEach(n => pbody.appendChild(n));
    const by = (f.reported_by || []).join(", "), also = (f.also_categorised_as || []).join(", ");
    if (by || also) pbody.querySelector(".refs").parentNode.appendChild(
      el("p", { "class": "gn" }, [by ? "Reported by " + by : "", also ? "Also categorised as " + also : ""].filter(Boolean).join(" · ")));
    const sibs = f.file ? ORDER.filter(id => id !== f.id && T[id].f.file === f.file) : [];
    if (sibs.length) {
      const box = el("div", { "class": "sib" });
      sibs.forEach(id => {
        const c = el("button", { type: "button", "class": "chip", title: T[id].f.title || id });
        c.style.setProperty("--sevc", sevVar(T[id].f.severity));
        c.appendChild(el("i")); c.appendChild(document.createTextNode(id));
        c.onclick = () => select(id);
        box.appendChild(c);
      });
      pbody.appendChild(sect("Also in this file", box));
    }
    const dash = el("p", { "class": "rv", style: "margin-top:18px" });
    dash.appendChild(el("a", { "class": "dash", href: "dashboard.html#" + encodeURIComponent(f.id) }, "Show in the dashboard list →"));
    pbody.appendChild(dash);
  }

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
    if (e.key === "Escape") {
      if (typing) { e.target.blur(); return; }
      if (SEL) closeSel(); else if (STATE.q) { STATE.q = ""; $("q").value = ""; search(false); flyTo(fitAll(), 0.6); }
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); $("q").focus(); $("q").select(); }
    else if (e.key === "ArrowRight" || e.key === "j") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft" || e.key === "k") { e.preventDefault(); step(-1); }
    else if (e.key === "0" || e.key === "f") { if (LAYOUT.order.length) flyTo(fitAll(), 0.7); }
    else if (e.key === "+" || e.key === "=") { const c = centre(); zoomAt(c.x, c.y, 1.4, 0.3); }
    else if (e.key === "-") { const c = centre(); zoomAt(c.x, c.y, 1 / 1.4, 0.3); }
  });

  /* ---------- entering and leaving Explore ---------- */
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="dashboard.html"]');
    if (!a || !ANIM || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault();
    const href = a.href;
    gsap.to(document.body, { opacity: 0, duration: 0.22, ease: "power1.in", onComplete: () => { location.href = href; } });
  });
  window.addEventListener("pageshow", () => { document.body.style.opacity = ""; });
  function fromHash() {
    let id = ""; try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    if (id && T[id] && id !== SEL) {
      if (!T[id].shown) clearAll();
      select(id);
    }
  }
  window.addEventListener("hashchange", fromHash);

  refresh(true);
  if (ANIM) {
    gsap.from("header.bar", { y: -18, opacity: 0, duration: 0.5, ease: "power2.out", clearProps: "all" });
    gsap.from("#tools", { y: -12, opacity: 0, duration: 0.5, delay: 0.08, ease: "power2.out", clearProps: "all" });
    gsap.from("#zoom, #mm, #hint", { opacity: 0, duration: 0.5, delay: 0.7, clearProps: "opacity" });
  }
  setTimeout(fromHash, ANIM ? 1250 : 0);
  setTimeout(hintOff, 9000);
})();
</script>
</body>
