<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Review Dashboard</title>
<!-- Self-contained: no external scripts, fonts or network requests. -->
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3df;
  --accent: #2f5bd3;
  --critical: #b3261e; --high: #d9622b; --medium: #c99a06; --low: #3d7ea6; --info: #7a7a74;
  --code-bg: #f1f0ec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1e1e1c; --text: #ecebe6; --muted: #a09f99; --line: #33332f;
    --accent: #7d9bf0;
    --critical: #f2766d; --high: #f0995f; --medium: #e8c14d; --low: #7cb8dc; --info: #a6a59f;
    --code-bg: #262624;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1e1e1c; --text: #ecebe6; --muted: #a09f99; --line: #33332f;
  --accent: #7d9bf0;
  --critical: #f2766d; --high: #f0995f; --medium: #e8c14d; --low: #7cb8dc; --info: #a6a59f;
  --code-bg: #262624;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 24px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 0 0 12px; }
.meta { color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin: 20px 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.big { font-size: 34px; font-weight: 650; line-height: 1.1; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 36px; align-items: center; gap: 8px; margin: 6px 0;
  font-size: 13px; }
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 5px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
select, input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--text); }
input[type=search] { flex: 1 1 220px; }
.sev { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
  color: #fff; white-space: nowrap; }
.finding { border-top: 1px solid var(--line); padding: 10px 0; }
.finding summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; list-style: none; }
.finding summary::-webkit-details-marker { display: none; }
.fid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
.loc { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted);
  overflow-wrap: anywhere; }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.body { padding: 8px 0 4px 0; }
.body h3 { font-size: 13px; margin: 12px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; }
.empty { color: var(--muted); padding: 16px 0; }
.theme { float: right; }
@media (max-width: 560px) { .bar-row { grid-template-columns: 110px 1fr 30px; } .big { font-size: 28px; } }
</style>
</head>
<body>
<main>
  <button class="theme" id="theme" type="button" style="font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer">Theme</button>
  <h1 id="title">Code Review</h1>
  <div class="meta" id="meta"></div>
  <div class="grid">
    <div class="card"><h2>Total findings</h2><div class="big" id="total"></div><div class="meta" id="status"></div></div>
    <div class="card"><h2>Code health</h2><div class="big" id="health"></div><div class="meta" id="health-sub"></div></div>
    <div class="card"><h2>By severity</h2><div id="sev-bars"></div></div>
    <div class="card"><h2>By category</h2><div id="cat-bars"></div></div>
  </div>
  <div class="card">
    <h2>Findings</h2>
    <div class="controls">
      <input type="search" id="q" placeholder="Search title, file, description…" aria-label="Search findings">
      <select id="f-sev" aria-label="Filter by severity"><option value="">All severities</option></select>
      <select id="f-cat" aria-label="Filter by category"><option value="">All categories</option></select>
      <select id="f-status" aria-label="Filter by status"><option value="">Confirmed + Potential</option>
        <option>Confirmed</option><option>Potential</option></select>
    </div>
    <div id="list"></div>
  </div>
</main>
<script id="review-data" type="application/json">{{data_json}}</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("review-data").textContent);
  var SEV = ["Critical", "High", "Medium", "Low", "Informational"];
  var SEV_VAR = { Critical: "--critical", High: "--high", Medium: "--medium", Low: "--low", Informational: "--info" };
  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function sevBadge(s) {
    var b = el("span", { "class": "sev" }, s);
    b.style.background = "var(" + SEV_VAR[s] + ")";
    return b;
  }
  function bars(target, counts, order, colorFor) {
    var max = Math.max.apply(null, order.map(function (k) { return counts[k] || 0; }).concat([1]));
    order.forEach(function (k) {
      var row = el("div", { "class": "bar-row" });
      row.appendChild(el("span", null, k));
      var bar = el("div", { "class": "bar" }), fill = el("span");
      fill.style.width = ((counts[k] || 0) / max * 100) + "%";
      fill.style.background = colorFor(k);
      bar.appendChild(fill); row.appendChild(bar);
      row.appendChild(el("span", { "class": "num" }, String(counts[k] || 0)));
      target.appendChild(row);
    });
  }
  try {
    var saved = localStorage.getItem("cr-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  } catch (e) {}
  document.getElementById("theme").onclick = function () {
    var cur = document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("cr-theme", next); } catch (e) {}
  };

  document.getElementById("title").textContent = "Code Review — " + data.repository;
  document.getElementById("meta").textContent = [data.review_type, data.scope_description, data.date,
    data.commit ? "commit " + data.commit : ""].filter(Boolean).join(" · ");
  document.getElementById("total").textContent = data.totals.findings;
  document.getElementById("status").textContent = data.totals.by_status.Confirmed + " confirmed · " +
    data.totals.by_status.Potential + " potential";
  document.getElementById("health").textContent = data.health.score + "/100";
  document.getElementById("health-sub").textContent = data.health.rating + " (heuristic, this review's findings only)";
  bars(document.getElementById("sev-bars"), data.totals.by_severity, SEV,
       function (k) { return "var(" + SEV_VAR[k] + ")"; });
  var cats = Object.keys(data.totals.by_category).filter(function (c) { return data.totals.by_category[c] > 0; });
  bars(document.getElementById("cat-bars"), data.totals.by_category, cats.length ? cats : Object.keys(data.totals.by_category),
       function () { return "var(--accent)"; });

  var fs = document.getElementById("f-sev"), fc = document.getElementById("f-cat");
  SEV.forEach(function (s) { fs.appendChild(el("option", null, s)); });
  Object.keys(data.totals.by_category).forEach(function (c) { fc.appendChild(el("option", null, c)); });

  function render() {
    var q = document.getElementById("q").value.toLowerCase();
    var sv = fs.value, cv = fc.value, st = document.getElementById("f-status").value;
    var list = document.getElementById("list");
    list.textContent = "";
    var shown = data.findings.filter(function (f) {
      if (sv && f.severity !== sv) return false;
      if (cv && f.category !== cv) return false;
      if (st && f.status !== st) return false;
      if (q && (f.id + " " + f.title + " " + f.file + " " + f.description).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    if (!shown.length) { list.appendChild(el("div", { "class": "empty" }, "No findings match these filters.")); return; }
    shown.forEach(function (f) {
      var d = el("details", { "class": "finding" });
      var s = el("summary");
      s.appendChild(sevBadge(f.severity));
      s.appendChild(el("span", { "class": "fid" }, f.id));
      s.appendChild(el("strong", null, f.title));
      s.appendChild(el("span", { "class": "loc" }, f.file + ":" + f.line));
      s.appendChild(el("span", { "class": "tag" }, f.category));
      s.appendChild(el("span", { "class": "tag" }, f.status + " · " + f.confidence + " confidence"));
      d.appendChild(s);
      var b = el("div", { "class": "body" });
      [["Description", f.description], ["Evidence", f.evidence, true], ["Potential impact", f.impact],
       ["Recommended solution", f.recommendation]].forEach(function (p) {
        b.appendChild(el("h3", null, p[0]));
        b.appendChild(el(p[2] ? "pre" : "p", null, p[1]));
      });
      if (f.related_locations && f.related_locations.length) {
        b.appendChild(el("h3", null, "Also at"));
        b.appendChild(el("p", { "class": "loc" }, f.related_locations.map(function (l) {
          return l.file + ":" + l.line; }).join(", ")));
      }
      b.appendChild(el("p", { "class": "meta" }, "Reported by " + (f.reported_by || []).join(", ")));
      d.appendChild(b);
      list.appendChild(d);
    });
  }
  ["q", "f-sev", "f-cat", "f-status"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", render);
  });
  render();
})();
</script>
</body>
</html>
